# Shared by BOTH apps (Njiani rider + Njiani Driver).
#
# Anything that is not specific to one app belongs here: design system, models,
# the Supabase data layer, localisation, geo helpers. A fix made here ships to
# both apps at once -- that is the whole reason the monorepo exists.
name: njiani_core
description: Shared design system, domain models and data layer for the Njiani apps.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Localisation. Both languages ship from C2 -- no English-only strings.
  flutter_localizations:
    sdk: flutter
  intl: any
  # State. Riverpod streams realtime data cleanly and is testable without a
  # widget tree, which matters once the driver feed arrives at C9.
  flutter_riverpod: ^2.6.1
  # Routing with guards: language chosen, signed in, driver approved.
  go_router: ^14.6.2
  # Per-device preferences: chosen language, so a returning user is never
  # asked again. Anything that must survive a reinstall lives in Postgres.
  shared_preferences: ^2.3.3
  # Auth, Postgres, Realtime and Storage in one client.
  supabase_flutter: ^2.8.2
  # Camera and gallery, for the driving licence photo at C6. Behind
  # LicenceCamera, so tests and the fake backend never touch the plugin --
  # and so swapping it later is a one-file change.
  #
  # NEEDS PLATFORM CONFIG: iOS requires NSCameraUsageDescription and
  # NSPhotoLibraryUsageDescription in Info.plist, or the app is terminated
  # the moment the camera opens. See docs/CREDENTIALS.md.
  image_picker: ^1.2.4
  # `tel:` links, for every "Call Njiani" button -- C6's rejection and
  # suspension screens, and the safety screen at C15. Flutter-team plugin, no
  # native code of our own to maintain.
  #
  # NEEDS PLATFORM CONFIG on Android 11+: a <queries> entry for ACTION_DIAL,
  # or canLaunchUrl reports false for a dialler that is plainly installed.
  # Both app manifests carry it.
  url_launcher: ^6.3.3
  # GPS, for the direction picker at C7 and the live position at C14. Behind
  # DriverLocation, so tests and the fake backend never touch the plugin.
  #
  # NEEDS PLATFORM CONFIG: iOS requires NSLocationWhenInUseUsageDescription,
  # Android ACCESS_FINE_LOCATION and ACCESS_COARSE_LOCATION. The driver app
  # carries both; the rider app does not need them until C14. See
  # docs/CREDENTIALS.md.
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Enables `flutter gen-l10n` for this package (see l10n.yaml).
  generate: true

  # Bricolage Grotesque, bundled rather than fetched at runtime: drivers are on
  # metered data, and text that reflows after a network fetch reads as a bug.
  # SIL Open Font License 1.1 -- see assets/fonts/OFL.txt.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-400.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
