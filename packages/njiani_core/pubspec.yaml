# Shared by BOTH apps (Njiani rider + Njiani Driver).
#
# Anything that is not specific to one app belongs here: design system, models,
# the Supabase data layer, localisation, geo helpers. A fix made here ships to
# both apps at once -- that is the whole reason the monorepo exists.
name: njiani_core
description: Shared design system, domain models and data layer for the Njiani apps.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Localisation. Both languages ship from C2 -- no English-only strings.
  flutter_localizations:
    sdk: flutter
  intl: any
  # State. Riverpod streams realtime data cleanly and is testable without a
  # widget tree, which matters once the driver feed arrives at C9.
  flutter_riverpod: ^2.6.1
  # Routing with guards: language chosen, signed in, driver approved.
  go_router: ^14.6.2
  # Per-device preferences: chosen language, so a returning user is never
  # asked again. Anything that must survive a reinstall lives in Postgres.
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Enables `flutter gen-l10n` for this package (see l10n.yaml).
  generate: true

  # Bricolage Grotesque, bundled rather than fetched at runtime: drivers are on
  # metered data, and text that reflows after a network fetch reads as a bug.
  # SIL Open Font License 1.1 -- see assets/fonts/OFL.txt.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-400.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
